<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Yana Parikh - AI, Software and Product Building" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1230"/>
      <stop offset="1" stop-color="#1B1F5C"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F3FF"/>
      <stop offset="1" stop-color="#B9A8FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <!-- isometric cube, unit size 60 -->
    <g id="cube">
      <polygon points="0,-30 52,-15 0,0 -52,-15" fill="#B9A8FF"/>
      <polygon points="-52,-15 0,0 0,60 -52,45" fill="#6C4DF0"/>
      <polygon points="52,-15 0,0 0,60 52,45" fill="#3A2BA8"/>
    </g>
    <g id="cubeTeal">
      <polygon points="0,-30 52,-15 0,0 -52,-15" fill="#8FF3E2"/>
      <polygon points="-52,-15 0,0 0,60 -52,45" fill="#2DD4BF"/>
      <polygon points="52,-15 0,0 0,60 52,45" fill="#0F8F82"/>
    </g>
    <g id="cubePeach">
      <polygon points="0,-30 52,-15 0,0 -52,-15" fill="#FFD7BF"/>
      <polygon points="-52,-15 0,0 0,60 -52,45" fill="#FFB38A"/>
      <polygon points="52,-15 0,0 0,60 52,45" fill="#D9764A"/>
    </g>
  </defs>
  <style>
    .float1{animation:f1 6s ease-in-out infinite}
    .float2{animation:f2 7.5s ease-in-out infinite}
    .float3{animation:f3 5.5s ease-in-out infinite}
    .float4{animation:f1 8s ease-in-out infinite reverse}
    @keyframes f1{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
    @keyframes f2{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
    @keyframes f3{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(2deg)}}
    .name{font:700 64px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-1px}
    .tag{font:400 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#C9C7F5}
    .sub{font:400 16px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#8F8DD0}
    .reveal{animation:rv 1.4s ease-out both}
    @keyframes rv{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
    .cursor{animation:blink 1s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#glow)"/>

  <g class="reveal">
    <text x="60" y="130" class="name" fill="url(#name)">Yana Parikh</text>
    <text x="62" y="172" class="tag">AI &amp; software builder. B.Tech IT student.</text>
    <text x="62" y="206" class="sub">Google Student Ambassador 2026 · AWS Student Builder Group Leader</text>
    <rect x="62" y="224" width="10" height="3" rx="1.5" fill="#2DD4BF" class="cursor"/>
  </g>

  <g transform="translate(760,120)" class="float1"><use href="#cube"/></g>
  <g transform="translate(850,175) scale(0.7)" class="float2"><use href="#cubeTeal"/></g>
  <g transform="translate(690,215) scale(0.55)" class="float3"><use href="#cubePeach"/></g>
  <g transform="translate(910,80) scale(0.45)" class="float4"><use href="#cube"/></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
